<div class="min-h-screen bg-slate-950 text-slate-50">
  <div class="mx-auto flex min-h-screen max-w-6xl items-center justify-center p-6">
    <div class="grid w-full overflow-hidden rounded-3xl border border-white/10 bg-slate-900/70 shadow-2xl shadow-orange-500/10 backdrop-blur md:grid-cols-2">
      <div class="hidden bg-gradient-to-br from-orange-500 via-amber-500 to-rose-500 p-10 md:flex md:flex-col md:justify-between">
        <div>
          <div class="text-sm font-semibold uppercase tracking-[0.32em] text-orange-50/80">Cloud Kitchen</div>
          <h1 class="mt-6 text-4xl font-bold leading-tight">Control every kitchen, order, and delivery in one place.</h1>
        </div>
        <div class="space-y-4 text-sm text-orange-50/80">
          <div class="flex items-center gap-3"><span class="h-2.5 w-2.5 rounded-full bg-white"></span> Live order orchestration</div>
          <div class="flex items-center gap-3"><span class="h-2.5 w-2.5 rounded-full bg-white"></span> Multi-brand menu management</div>
          <div class="flex items-center gap-3"><span class="h-2.5 w-2.5 rounded-full bg-white"></span> Role-based operations</div>
        </div>
      </div>

      <div class="p-8 sm:p-10">
        <div class="mb-8 text-center md:text-left">
          <p class="text-sm font-medium uppercase tracking-[0.24em] text-orange-300">Admin access</p>
          <h2 class="mt-3 text-3xl font-bold">Welcome back</h2>
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">
          <div>
            <label for="email" class="mb-2 block text-sm font-medium text-slate-200">Email</label>
            <input id="email" type="email" formControlName="email" class="w-full rounded-xl border border-slate-700 bg-slate-950/80 px-4 py-3 text-slate-50 outline-none transition focus:border-orange-400 focus:ring-2 focus:ring-orange-500/20" placeholder="admin@cloudkitchen.io" />
          </div>

          <div>
            <label for="password" class="mb-2 block text-sm font-medium text-slate-200">Password</label>
            <input id="password" type="password" formControlName="password" class="w-full rounded-xl border border-slate-700 bg-slate-950/80 px-4 py-3 text-slate-50 outline-none transition focus:border-orange-400 focus:ring-2 focus:ring-orange-500/20" placeholder="••••••••" />
          </div>

          @if (errorMessage()) {
            <div class="rounded-xl border border-red-500/30 bg-red-500/10 px-4 py-3 text-sm text-red-200">{{ errorMessage() }}</div>
          }

          <button type="submit" [disabled]="form.invalid || isSubmitting()" class="flex w-full items-center justify-center rounded-xl bg-gradient-to-r from-orange-500 to-amber-400 px-4 py-3 font-semibold text-slate-950 transition hover:opacity-95 disabled:cursor-not-allowed disabled:opacity-60">
            {{ isSubmitting() ? 'Signing in...' : 'Sign in' }}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
