<div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
  <div class="mb-4 flex items-center justify-between gap-3">
    <h3 class="text-xl font-semibold text-slate-900">Categories</h3>
    <button type="button" (click)="toggleForm()" class="rounded-xl bg-orange-500 px-3 py-2 text-sm font-medium text-white">
      {{ showForm ? 'Close' : 'New category' }}
    </button>
  </div>

  @if (showForm) {
    <form [formGroup]="form" (ngSubmit)="save()" class="mb-5 grid gap-3 rounded-2xl border border-slate-200 bg-slate-50 p-4 md:grid-cols-2">
      <div class="md:col-span-2">
        <label class="mb-1 block text-sm font-medium text-slate-700">Name</label>
        <input formControlName="name" class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 outline-none focus:border-orange-400" />
      </div>
      <div class="md:col-span-2">
        <label class="mb-1 block text-sm font-medium text-slate-700">Description</label>
        <textarea formControlName="description" rows="3" class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 outline-none focus:border-orange-400"></textarea>
      </div>
        <div class="md:col-span-2">
            <label class="mb-1 block text-sm font-medium text-slate-700">Slug</label>
            <textarea formControlName="slug" rows="3"
                class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 outline-none focus:border-orange-400"></textarea>
        </div>
        <div class="md:col-span-2">
            <label class="mb-1 block text-sm font-medium text-slate-700">Image</label>
            <input type="text" formControlName="image" class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 outline-none focus:border-orange-400" />
        </div>
      <div class="md:col-span-2 flex justify-end gap-2">
        <button type="button" (click)="resetForm()" class="rounded-xl border border-slate-200 px-3 py-2 text-sm font-medium text-slate-700">Reset</button>
        <button type="submit" [disabled]="loading" class="rounded-xl bg-slate-900 px-3 py-2 text-sm font-medium text-white disabled:opacity-60">
          {{ loading ? 'Saving...' : 'Save' }}
        </button>
      </div>
    </form>
  }

  @if (errorMessage) {
    <div class="mb-4 rounded-xl border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">{{ errorMessage }}</div>
  }

  <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
    @for (category of categories(); track category.id) {
      <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4">
        <div class="mb-3 flex items-center justify-between gap-3">
          <span class="flex items-center gap-3">
              @if(category.image){
            <img [src]="category.image" alt="{{ category.name }}" class="h-10 w-10 rounded-full object-cover" />
            }
             <h4 class="text-lg font-semibold text-slate-900">{{ category.name }}</h4>
          </span>
          <!-- <span class="rounded-full bg-orange-100 px-2 py-1 text-xs font-medium text-orange-700"></span> -->
          <button type="button" (click)="deleteCategory(category.id)" class="text-xs font-medium text-red-600">Delete</button>
        </div>       
        <p class="mt-2 text-sm text-slate-600">{{ category.description }}</p>
      </div>
    }
  </div>
</div>
