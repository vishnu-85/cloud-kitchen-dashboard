<div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
  <div class="mb-4 flex items-center justify-between">
    <h3 class="text-xl font-semibold text-slate-900">Orders</h3>
    <button class="rounded-xl bg-slate-900 px-3 py-2 text-sm font-medium text-white">Dispatch queue</button>
  </div>
  <div class="space-y-3">
    @for (order of orders(); track order.id) {
      <div class="flex flex-col gap-3 rounded-2xl border border-slate-200 bg-slate-50 p-4 md:flex-row md:items-center md:justify-between">
        <div>
          <p class="text-sm font-medium text-slate-500">Order #{{ order.id }}</p>
          <p class="mt-1 text-lg font-semibold text-slate-900">{{ order.customer }}</p>
        </div>
        <div class="flex items-center gap-3">
          <span class="text-sm text-slate-600">{{ order.items }} items</span>
          <span class="text-sm font-medium text-slate-900">${{ order.total }}</span>
          <span class="rounded-full px-2.5 py-1 text-xs font-medium" [ngClass]="getStatusClass(order.status)">{{ order.status }}</span>
        </div>
      </div>
    }
  </div>
</div>
