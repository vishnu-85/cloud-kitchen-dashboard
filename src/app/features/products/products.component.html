<div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
  <div class="mb-4 flex items-center justify-between">
    <h3 class="text-xl font-semibold text-slate-900">Products</h3>
    <button class="rounded-xl border border-slate-200 px-3 py-2 text-sm font-medium text-slate-700">Export catalog</button>
  </div>

  <div class="overflow-x-auto">
        <table class="min-w-full text-left text-sm">
          <thead class="bg-slate-50 text-slate-600">
            <tr>
              <th class="px-4 py-3">Name</th>
              <th class="px-4 py-3">Price</th>
              <th class="px-4 py-3">Discount Price</th>
              <th class="px-4 py-3">Category</th>
              <th class="px-4 py-3">Status</th>
              <th class="px-4 py-3 text-right">Action</th>
            </tr>
          </thead>
          <tbody>
            @for (product of products(); track product.name) {
              <tr class="border-t border-slate-200">
                <td class="px-4 py-3">{{ product.name }}</td>
                <td class="px-4 py-3 text-slate-600">{{ product.price }}</td>
                <td class="px-4 py-3 text-slate-600">{{ product.discountPrice }}</td>
                <td class="px-4 py-3">{{ product.categoryId.name }}</td>
                <td class="px-4 py-3">
                  <span class="rounded-full px-2 py-1 text-xs font-medium" [ngClass]="product.isAvailable ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'">
                    {{ product.isAvailable ? 'Available' : 'Low stock' }}
                    </span>
                </td>
                <td class="px-4 py-3 text-right">
                  <button type="button" (click)="deleteProduct(product.id)" class="text-sm font-medium text-red-600">
                    Delete
                  </button>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
